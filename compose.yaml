services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis

volumes:
  redis-data:
